#
# Define any additional hardware for this MMU unit, e.g. heaters, enclosure temperature probes, etc
#
# EXCLUDE FROM CONFIG BUILDER -- IMPORTANT do not alter or remove this line. Config below is never upgraded
#
# NFC readers are held in reset until NRSTPD is driven high
[output_pin unit0_nfc_rst]
pin: unit0:PB12
value: 1
shutdown_value: 0

# NFC reader gates 0/1
[mmu_nfc_reader unit0_nfc01]
reader_type           : rc522
cs_pin                : unit0:PC6
spi_bus: spi2
spi_speed: 5000000
debug                 : 0

# NFC reader gates 2/3
rx_gain: 0
[mmu_nfc_reader unit0_nfc23]
reader_type           : rc522
cs_pin                : unit0:PC7
spi_bus: spi2
spi_speed: 5000000
debug                 : 0
rx_gain: 0

[heater_generic Box_heater]
max_power: 0.8
heater_pin: unit0:PA3
sensor_type: temperature_combined
sensor_list: temperature_sensor Box_Env
combination_method: mean
maximum_deviation: 100
control: pid
pid_Kp: 63.418
pid_Ki: 1.342
pid_Kd: 749.125
min_temp: -100
max_temp: 80
max_power: 0.5

[verify_heater Box_heater]
max_error: 400
check_gain_time: 600

[temperature_sensor Box_heater_temp_a]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: unit0:PC1
min_temp: -100
max_temp: 110

[temperature_sensor Box_heater_temp_b]
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: unit0:PC2
min_temp: -100
max_temp: 110

[controller_fan Box_heater_fan_a]
pin: unit0:PA4
fan_speed: 1.0
idle_timeout: 30
heater: Box_heater
# This forces the fan to stay on if the thermistor is above 35C:
stepper: mmu_stepper unit0_gear
shutdown_speed: 0

[controller_fan Box_heater_fan_b]
pin: unit0:PA5
fan_speed: 1.0
idle_timeout: 30
heater: Box_heater
# This forces the fan to stay on if the thermistor is above 35C:
stepper: mmu_stepper unit0_gear
shutdown_speed: 0

[controller_fan Box_board_fan]
pin: unit0:PA6
stepper: mmu_stepper unit0_gear, mmu_stepper unit0_gear_1, mmu_stepper unit0_gear_2, mmu_stepper unit0_gear_3
heater: Box_heater 
shutdown_speed: 0

