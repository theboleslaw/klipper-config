# Below you can include specific configuration files depending on what you want KAMP to do:

#[include ./KAMP/Adaptive_Meshing.cfg]       # Include to enable adaptive meshing configuration.
#[include ./KAMP/Line_Purge.cfg]             # Include to enable adaptive line purging configuration.
#[include ./KAMP/Voron_Purge.cfg]            # Include to enable adaptive Voron logo purging configuration.
#[include ./KAMP/Smart_Park.cfg]             # Include to enable the Smart Park function, which parks the printhead near the print area for final heating.

[gcode_macro _KAMP_Settings]
description: This macro contains all adjustable settings for KAMP

# The following variables are settings for KAMP as a whole.
variable_verbose_enable: True               # Set to True to enable KAMP information output when running. This is useful for debugging.

# The following variables are for adjusting adaptive mesh settings for KAMP.
variable_mesh_margin: 8                     # Expands the mesh area around the print by this many mm (covers skirt/brim). 5-10 is a good range.
variable_fuzz_amount: 3                     # Randomly shifts the mesh edges by up to +/- this many mm every run, so probe spots differ even for the same gcode. 0 disables. Capped to mesh_margin.
variable_min_points_lagrange: 3             # Fewest points per axis when the mesh is small (lagrange). 3 is the minimum Klipper allows.
variable_min_points_bicubic: 4              # Fewest points per axis when bicubic is used. 4 is the minimum Klipper allows.

# The following variables are for those with a dockable probe like Klicky, Euclid, etc.                 # ----------------  Attach Macro | Detach Macro
variable_probe_dock_enable: False           # Set to True to enable the usage of a dockable probe.      # ---------------------------------------------
variable_attach_macro: 'Attach_Probe'       # The macro that is used to attach the probe.               # Klicky Probe:   'Attach_Probe' | 'Dock_Probe'
variable_detach_macro: 'Dock_Probe'         # The macro that is used to store the probe.                # Euclid Probe:   'Deploy_Probe' | 'Stow_Probe'
                                                                                                        # Legacy Gcode:   'M401'         | 'M402'

# The following variables are for adjusting adaptive purge settings for KAMP.
variable_purge_height: 0.8                  # Z position of nozzle during purge, default is 0.8.
variable_tip_distance: 0                    # Distance between tip of filament and nozzle before purge. Should be similar to PRINT_END final retract amount.
variable_purge_margin: 10                   # Distance the purge will be in front of the print area, default is 10.
variable_purge_amount: 30                   # Amount of filament to be purged prior to printing.
variable_flow_rate: 12                      # Flow rate of purge in mm3/s. Default is 12.

# The following variables are for adjusting the Smart Park feature for KAMP, which will park the printhead near the print area at a specified height.
variable_smart_park_height: 10              # Z position for Smart Park, default is 10.

gcode: # Gcode section left intentionally blank. Do not disturb.

    {action_respond_info(" Running the KAMP_Settings macro does nothing, it is only used for storing KAMP settings. ")}


# # # Klipper Adaptive Meshing # # #

# Heads up! If you have any other BED_MESH_CALIBRATE macros defined elsewhere in your config, you will need to comment out / remove them for this to work. (Klicky/Euclid Probe)
# You will also need to be sure that [exclude_object] is defined in printer.cfg, and your slicer is labeling objects.
# This macro parses the objects in your gcode to find the min and max area to probe, creating an adaptive mesh.
# Both the AREA and the NUMBER OF POINTS shrink with the print: point spacing stays the same as your full-bed probe_count,
# so a small print gets a small mesh (as few as 3x3 points) and a full-bed print gets the full probe_count.

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE
gcode:

    {% set all_points = printer.exclude_object.objects | map(attribute='polygon') | sum(start=[]) %}
    {% set bed_mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}
    {% set bed_mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}
    {% set probe_count = printer.configfile.settings.bed_mesh.probe_count %}
    {% set kamp_settings = printer["gcode_macro _KAMP_Settings"] %}
    {% set verbose_enable = kamp_settings.verbose_enable | abs %}
    {% set probe_dock_enable = kamp_settings.probe_dock_enable | abs %}
    {% set attach_macro = kamp_settings.attach_macro | string %}
    {% set detach_macro = kamp_settings.detach_macro | string %}
    {% set mesh_margin = kamp_settings.mesh_margin | float %}
    {% set fuzz_amount = kamp_settings.fuzz_amount | float %}
    {% set min_points_lagrange = kamp_settings.min_points_lagrange | int %}
    {% set min_points_bicubic = kamp_settings.min_points_bicubic | int %}
    {% set probe_count = probe_count if probe_count|length > 1 else probe_count * 2 %}

    {% set max_probe_point_distance_x = ( bed_mesh_max[0] - bed_mesh_min[0] ) / (probe_count[0] - 1) %}
    {% set max_probe_point_distance_y = ( bed_mesh_max[1] - bed_mesh_min[1] ) / (probe_count[1] - 1) %}

    {% set x_min = all_points | map(attribute=0) | min | default(bed_mesh_min[0]) %}
    {% set y_min = all_points | map(attribute=1) | min | default(bed_mesh_min[1]) %}
    {% set x_max = all_points | map(attribute=0) | max | default(bed_mesh_max[0]) %}
    {% set y_max = all_points | map(attribute=1) | max | default(bed_mesh_max[1]) %}

    {% set fuzz = [fuzz_amount, mesh_margin] | min %}
    {% set fuzz_range = range((0 - fuzz * 100) | int, (fuzz * 100) | int + 1) %}
    {% set adapted_x_min = x_min - mesh_margin + (fuzz_range | random / 100.0) %}
    {% set adapted_y_min = y_min - mesh_margin + (fuzz_range | random / 100.0) %}
    {% set adapted_x_max = x_max + mesh_margin + (fuzz_range | random / 100.0) %}
    {% set adapted_y_max = y_max + mesh_margin + (fuzz_range | random / 100.0) %}

    {% set adapted_x_min = [adapted_x_min, bed_mesh_min[0]] | max %}
    {% set adapted_y_min = [adapted_y_min, bed_mesh_min[1]] | max %}
    {% set adapted_x_max = [adapted_x_max, bed_mesh_max[0]] | min %}
    {% set adapted_y_max = [adapted_y_max, bed_mesh_max[1]] | min %}

    {% set points_x = (((adapted_x_max - adapted_x_min) / max_probe_point_distance_x) | round(method='ceil') | int) + 1 %}
    {% set points_y = (((adapted_y_max - adapted_y_min) / max_probe_point_distance_y) | round(method='ceil') | int) + 1 %}

    {% if (([points_x, points_y]|max) > 6) %}
        {% set algorithm = "bicubic" %}
        {% set min_points = min_points_bicubic %}
    {% else %}
        {% set algorithm = "lagrange" %}
        {% set min_points = min_points_lagrange %}
    {% endif %}

    {% set points_x = [points_x, min_points]|max %}
    {% set points_y = [points_y, min_points]|max %}
    {% set points_x = [points_x, probe_count[0]]|min %}
    {% set points_y = [points_y, probe_count[1]]|min %}

    {% if verbose_enable == True %}
        {% if printer.exclude_object.objects != [] %}
            {action_respond_info("KAMP mesh: {}x{} points ({}), bounds {},{} to {},{}. Full bed was {}x{} points. Fuzz +/-{}mm.".format(
                (points_x), (points_y), (algorithm),
                (adapted_x_min | round(1)), (adapted_y_min | round(1)),
                (adapted_x_max | round(1)), (adapted_y_max | round(1)),
                (probe_count[0]), (probe_count[1]), (fuzz),
            ))}
        {% else %}
            {action_respond_info("KAMP: no objects detected, meshing the full bed. Make sure EXCLUDE_OBJECT_DEFINE runs before BED_MESH_CALIBRATE.")}
        {% endif %}
    {% endif %}

    {% if probe_dock_enable == True %}
        {attach_macro}
    {% endif %}

    _BED_MESH_CALIBRATE mesh_min={adapted_x_min},{adapted_y_min} mesh_max={adapted_x_max},{adapted_y_max} ALGORITHM={algorithm} PROBE_COUNT={points_x},{points_y} PROFILE={params.PROFILE | default("default")}

    {% if probe_dock_enable == True %}
        {detach_macro}
    {% endif %}
